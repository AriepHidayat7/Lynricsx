name: CI

# Windows-only project: the backend binds WinRT (Windows.Media.Control) and the
# Win32 registry, so there is intentionally no ubuntu or macos job.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Superseded runs on the same ref are cancelled to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (tests + types + bundle)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Production bundle
        run: npm run build

  backend:
    name: Backend (type check + unit tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the GNU host (the project's default build path),
      # so the MSVC toolchain used for test execution is requested explicitly.
      - name: Set up Rust (GNU host, from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust (MSVC, for running unit tests)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Type check (including tests)
        working-directory: src-tauri
        run: cargo check --tests --all-targets

      # Unit tests run on MSVC: on the GNU host the test harness fails to load
      # (0xC0000139) because both windows 0.58 and 0.62 are linked. See
      # docs/BUILDING.md.
      - name: Unit tests
        working-directory: src-tauri
        run: cargo +stable-x86_64-pc-windows-msvc test --lib

  installer:
    name: Build Windows installer
    runs-on: windows-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build application and NSIS installer
        run: npm run tauri:build

      # Artifact only. Creating a GitHub Release is a deliberate manual step and
      # is never triggered from CI.
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Lynricsx-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
