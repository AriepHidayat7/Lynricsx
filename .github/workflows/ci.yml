name: CI

# Windows-only project: the backend binds WinRT (Windows.Media.Control) and the
# Win32 registry, so there is intentionally no ubuntu or macos job.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Superseded runs on the same ref are cancelled to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (tests + types + bundle)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Production bundle
        run: npm run build

  backend:
    name: Backend (type check + unit tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins `channel = "stable-x86_64-pc-windows-gnu"`, and
      # rustup rejects a target tuple in `channel` when it has to *install* the
      # toolchain ("error: target tuple in channel name"). That only bites on a
      # fresh runner, so both host toolchains are installed explicitly here with
      # rustup, which does accept the tuple. `dtolnay/rust-toolchain` is avoided
      # for that reason; it cannot express this pin.
      - name: Install Rust toolchains (GNU host + MSVC for tests)
        shell: pwsh
        run: |
          rustup set profile default
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --no-self-update
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --no-self-update
          rustup target add x86_64-pc-windows-gnu --toolchain stable-x86_64-pc-windows-msvc

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Type-checks the real GNU build path (what `npm run tauri:build` uses).
      - name: Type check (including tests)
        working-directory: src-tauri
        run: cargo check --target x86_64-pc-windows-gnu --tests --all-targets

      # Unit tests run on MSVC: on the GNU host the test harness fails to load
      # (0xC0000139) because both windows 0.58 and 0.62 are linked. See
      # docs/BUILDING.md.
      - name: Unit tests
        working-directory: src-tauri
        run: cargo +stable-x86_64-pc-windows-msvc test --lib

  installer:
    name: Build Windows installer
    runs-on: windows-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust (stable, with the GNU target)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      # `npm run tauri:build` compiles a Windows resource with the GNU toolchain,
      # which needs MinGW `windres`. The windows runner image ships GCC and GNU
      # Binutils, so the usual case is simply making them discoverable; WinLibs is
      # downloaded only as a fallback when `windres` is genuinely absent. The step
      # is non-fatal: the build itself reports a clear error if it is missing.
      - name: Ensure MinGW windres is available
        shell: pwsh
        continue-on-error: true
        run: |
          $found = Get-ChildItem "C:\", "C:\ProgramData", "C:\tools" -Recurse -Filter windres.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            "Using existing windres: $($found.FullName)"
            $found.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            exit 0
          }
          "windres not found on the image; downloading WinLibs."
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/15.2.0posix-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r3.zip"
          $zip = Join-Path $env:RUNNER_TEMP "winlibs.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "C:\WinLibs" -Force
          $bin = Get-ChildItem "C:\WinLibs" -Recurse -Filter windres.exe | Select-Object -First 1
          if ($bin) { $bin.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build application and NSIS installer
        run: npm run tauri:build

      # Artifact only. Creating a GitHub Release is a deliberate manual step and
      # is never triggered from CI.
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Lynricsx-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
